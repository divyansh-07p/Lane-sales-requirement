<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor availability — demo</title>
<style>
  :root{
    --gc-border:#dadce0; --gc-text:#202124; --gc-text-2:#5f6368;
    --gc-bg-hover:#f1f3f4; --gc-blue:#1a73e8; --gc-blue-bg:#e8f0fe;
    --gc-green-fill:#e6f4ea; --gc-green-hover:#c0ebce; --gc-green-text:#137333;
    --gc-red-text:#d93025;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--gc-text);font-family:Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  .shell{max-width:1400px;margin:0 auto;padding:20px 24px 64px}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:linear-gradient(#fff 78%,rgba(255,255,255,0));padding:8px 0 18px}
  .brand h1{margin:0;font-size:21px;font-weight:500;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .brand-dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#1a73e8 0%,#4285f4 60%,#34a853 100%);border:3px solid #fff;box-shadow:0 0 0 1px var(--gc-border)}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-btn{font-size:13px;color:var(--gc-text);background:#fff;border:1px solid var(--gc-border);border-radius:18px;padding:7px 12px;transition:background .15s,box-shadow .15s}
  .cal-btn:hover:not(:disabled){background:#f8f9fa;box-shadow:0 1px 2px rgba(60,64,67,.2)}
  .cal-btn:disabled{opacity:.38;cursor:default}
  .cal-btn.today{font-weight:500}
  .cal-btn.chev{width:34px;height:34px;padding:0;border-radius:50%;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
  .cal-month{min-width:210px;text-align:center;font-size:21px;letter-spacing:-.2px;padding:0 6px}
  .controls-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .search{position:relative;min-width:300px}
  .sort-select{padding:7px 12px;border:1px solid var(--gc-border);border-radius:18px;font-size:13px;background:#fff;color:var(--gc-text);cursor:pointer}
  .sort-select:hover{background:var(--gc-bg-hover)}
  .sort-select:focus{border-color:var(--gc-blue);outline:none}
  .search input{width:100%;padding:8px 14px;border:1px solid var(--gc-border);border-radius:18px;font-size:13.5px;background:#fff;color:var(--gc-text);outline:none}
  .search input:focus{border-color:var(--gc-blue);box-shadow:0 0 0 1px var(--gc-blue)}
  .suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--gc-border);border-radius:12px;box-shadow:0 2px 6px rgba(60,64,67,.15),0 8px 20px rgba(60,64,67,.2);max-height:320px;overflow:auto}
  .suggest-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .suggest-row:hover{background:var(--gc-bg-hover)}
  .suggest-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .suggest-btn{flex:none;font-size:11.5px;font-weight:600;color:var(--gc-blue);background:var(--gc-blue-bg);border-radius:12px;padding:3px 10px}
  .suggest-row.added .suggest-btn{color:var(--gc-green-text);background:var(--gc-green-fill)}
  .clear-select{margin-left:8px;border:1px solid var(--gc-border);background:#fff;color:var(--gc-blue);font-size:12px;font-weight:500;border-radius:16px;padding:2px 12px}
  .clear-select:hover{background:var(--gc-bg-hover)}
  .remove-instr{flex:none;margin-left:auto;width:22px;height:22px;border:none;border-radius:50%;background:#fce8e6;color:var(--gc-red-text);font-size:15px;line-height:1}
  .remove-instr:hover{background:#fad2cf}
  .summary{margin:4px 0 14px;font-size:12.5px;color:var(--gc-text-2)}
  .summary strong{color:var(--gc-text)}
  .tabs{display:flex;gap:2px;overflow-x:auto;padding:2px 0 14px;margin-bottom:14px;scrollbar-width:thin}
  .tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:88px;padding:8px 6px 10px;background:transparent;border:none;border-radius:10px;font-size:11.5px;cursor:pointer}
  .tab:hover{background:var(--gc-bg-hover)}
  .tab span{color:var(--gc-text-2);font-weight:500}
  .tab strong{font-size:13px;font-weight:500;color:var(--gc-text);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .tab em{font-style:normal;color:var(--gc-green-text);font-size:10.5px;font-weight:600;white-space:nowrap}
  .tab.active{background:var(--gc-blue-bg)}
  .tab.active strong{background:var(--gc-blue);color:#fff}
  .grid-wrap{overflow:auto;max-height:74vh;border:1px solid var(--gc-border);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.1),0 2px 6px rgba(60,64,67,.1)}
  .grid, .mini{border-collapse:collapse;min-width:100%}
  .grid th,.grid td{border-right:1px solid var(--gc-border);border-bottom:1px solid var(--gc-border);padding:6px 8px;text-align:center;font-size:12px;height:30px;color:var(--gc-text)}
  .grid thead th{position:sticky;top:0;z-index:2;background:#f8f9fa;border-bottom:1px solid var(--gc-border);font-weight:500;color:var(--gc-text-2);font-size:11px;height:40px}
  .col-time-h,.mini-time{position:relative;min-width:48px;font-variant-numeric:tabular-nums}
  .time-label{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;background:inherit;padding:0 2px}
  .col-instructor{position:sticky;left:0;z-index:2;min-width:224px;text-align:left !important;background:#f8f9fa !important}
  .instructor-cell{position:sticky;left:0;z-index:1;background:#fff;text-align:left;display:flex;align-items:center;gap:8px;min-width:224px;height:100%;padding:10px 12px !important}
  .instructor-name{font-weight:500;font-size:13px;white-space:nowrap;max-width:186px;overflow:hidden;text-overflow:ellipsis}
  .expand{border:none;background:transparent;color:var(--gc-text-2);font-size:11px;width:22px;height:22px;border-radius:50%;flex:none}
  .expand:hover{background:var(--gc-bg-hover);color:var(--gc-blue)}
  .cell{position:relative;min-width:38px;height:26px;padding:0 !important;cursor:pointer}
  .cell-selected{box-shadow:inset 0 0 0 2px var(--gc-blue)}
  .slot-pop{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:60;min-width:220px;max-width:300px;background:#fff;border:1px solid var(--gc-border);border-radius:8px;box-shadow:0 1px 3px rgba(60,64,67,.24),0 4px 8px rgba(60,64,67,.24);padding:10px 13px;text-align:left;white-space:normal}
  .slot-pop::after{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--gc-border)}
  .slot-pop::before{content:"";position:absolute;bottom:calc(100% - 1px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#fff;z-index:1}
  .pop-title{font-size:11.5px;font-weight:600;margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
  .pop-title.free{color:var(--gc-green-text)}
  .pop-title.busy{color:var(--gc-red-text)}
  .pop-line{font-size:12.5px;line-height:1.5;word-break:break-word}
  .cell-free{background:var(--gc-green-fill)}
  .cell-free:hover{background:var(--gc-green-hover)}
  .detail-row td{padding:0 !important;border-bottom:1px solid var(--gc-border)}
  .detail{overflow:auto;max-height:60vh;background:#fbfbfc;border-top:1px solid var(--gc-border)}
  .detail-areas{padding:8px 12px;font-size:12px;color:var(--gc-text-2);border-bottom:1px solid #f1f3f4}
  .mini th,.mini td{border-right:1px solid var(--gc-border);border-bottom:1px solid var(--gc-border);padding:4px 6px;font-size:11px}
  .mini th{position:sticky;top:0;background:#f8f9fa;color:var(--gc-text-2);font-weight:500}
  .mini-date{position:sticky;left:0;background:#f8f9fa;text-align:left;white-space:nowrap;font-weight:500}
  .mini-date .mini-count{margin-left:8px;color:var(--gc-green-text);font-weight:700}
  .mini-row.current .mini-date{background:var(--gc-blue-bg);color:var(--gc-blue)}
  .mini .cell{min-width:32px;height:18px}
  .mini .cell-free{background:var(--gc-green-fill)}
  .mini .cell-free:hover{background:var(--gc-green-hover)}
  .empty,.state{color:var(--gc-text-2);font-size:13px;text-align:center;padding:24px}
  .legend{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--gc-text-2)}
  .swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
  .swatch.free{background:var(--gc-green-fill);border:1px solid var(--gc-green-hover)}
  .swatch.busy{background:#fff;border:1px solid var(--gc-border)}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><h1><span class="brand-dot"></span> Instructor availability</h1></div>
    <div class="cal-nav">
      <button type="button" class="cal-btn today" id="btnToday">Today</button>
      <button type="button" class="cal-btn chev" id="btnPrev" aria-label="Previous month">&lsaquo;</button>
      <div class="cal-month" id="calMonth"></div>
      <button type="button" class="cal-btn chev" id="btnNext" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="controls-row">
      <select class="sort-select" id="monthSelect" aria-label="Select month"></select>
      <select class="sort-select" id="sortSelect" aria-label="Sort instructors">
        <option value="freeDesc">Filter (Most free slots)</option>
        <option value="freeAsc">Filter (Least free slots)</option>
        <option value="alpha">Filter (A &rarr; Z)</option>
      </select>
      <div class="search">
        <input type="search" id="searchInput" placeholder="Search or compare instructors&hellip;" autocomplete="off" aria-label="Search instructors by name">
        <ul class="suggest" id="suggest" style="display:none"></ul>
      </div>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <nav class="tabs" id="tabs" aria-label="Select date"></nav>
  <div class="grid-wrap">
    <table class="grid roster">
      <thead><tr><th class="col-instructor">Instructor</th></tr></thead>
      <tbody id="gridBody"></tbody>
    </table>
    <p class="empty" id="empty" style="display:none">No instructors match. Clear the search filter.</p>
  </div>
  <div class="legend">
    <span><span class="swatch free"></span>Free slot</span>
    <span><span class="swatch busy"></span>Occupied / unavailable</span>
  </div>
</main>

<script>
// ===== mock data =====
const GRID_MINUTES = 30;
const DAY_START = 6 * 60;
const DAY_END = 20 * 60;

const timeStarts = [];
for (let m = DAY_START; m < DAY_END; m += GRID_MINUTES) timeStarts.push(m);
const timeCols = timeStarts.map(minutesToTime);

const INSTRUCTORS = [
  ["i1","Aisha Khan",["Andheri","Juhu"]],
  ["i2","Rahul Sharma",["Bandra","Khar"]],
  ["i3","Priya Mehta",["Lower Parel","Prabhadevi"]],
  ["i4","Vikram Singh",["Powai","Ghatkopar"]],
  ["i5","Neha Gupta",["Gurgaon Sec 56","Gurgaon Sec 45"]],
  ["i6","Arjun Nair",["Kochi","Ernakulam"]],
  ["i7","Sneha Reddy",["Jubilee Hills","Banjara Hills"]],
  ["i8","Karan Malhotra",["Saket","Vasant Kunj"]],
  ["i9","Divya Iyer",["Indiranagar","HSR Layout"]],
  ["i10","Aditya Rao",["Koramangala","Whitefield"]],
  ["i11","Pooja Joshi",["Baner","Aundh"]],
  ["i12","Rohan Deshmukh",["Viman Nagar","Koregaon Park"]]
].map(([id,name,areas]) => ({id,name,areas}));

const LEARNERS = [
  ["Rakesh Verma","Powai","Hatchback"],
  ["Sana Shaikh","Bandra","Automatic"],
  ["Manish Kumar","Gurgaon Sec 56","Sedan"],
  ["Ishita Bose","Indiranagar","SUV"],
  ["Farhan Ali","Jubilee Hills","Defensive"],
  ["Kavita Nair","Ernakulam","Hatchback"],
  ["Deepak Yadav","Saket","Sedan"],
  ["Ritika Malhotra","Aundh","Automatic"],
  ["Ankit Tiwari","Koramangala","SUV"],
  ["Meghana Rao","Whitefield","Hatchback"]
];
const COURSES = ["Hatchback","Sedan","SUV","Automatic","Defensive"];
const PAUSE_NOTES = ["On leave","Vehicle maintenance","RTO paperwork pending"];

// ===== date helpers =====
function isoToDate(iso){ const d=new Date(iso+"T00:00:00Z"); return new Date(d.getTime()-60000); }
function isoAddDays(iso, n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function shortDate(iso){
  const d=new Date(iso+"T00:00:00Z");
  return {
    weekday:d.toLocaleDateString("en-GB",{weekday:"short"}),
    date:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
    day:d.toLocaleDateString("en-GB",{day:"numeric"})
  };
}
function minutesToTime(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function monthLabel(m){ const d=new Date(m+"-01T00:00:00Z"); return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }

// seeded rng so the demo looks stable
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

// ===== generate availability =====
const from = isoAddDays(new Date().toISOString().slice(0,10), 0);
const HORIZON_DAYS = 180;
let dates = [];
for (let i = 0; i < HORIZON_DAYS; i++) { const d = isoAddDays(new Date().toISOString().slice(0,10), 1 + i); if (d >= from) dates.push(d); }

const freeGrid = new Map();      // instrId -> Map(date -> Set(minutes))
const windowTotals = new Map();  // instrId -> total free minutes
const blocks = new Map();        // instrId -> Map(date -> array of {start,end,kind,learner,course,area,note})

INSTRUCTORS.forEach((instr, idx) => {
  const rng = mulberry32(hashStr(instr.id));
  const perDate = new Map();
  windowTotals.set(instr.id, 0);
  dates.forEach(date => {
    const free = new Set();
    const dayBlocks = [];
    // instructor unavailable entirely on some days
    if (rng() < 0.05) {
      dayBlocks.push({start:DAY_START, end:DAY_END, kind:"unavailable", note:"Not available this day"});
      perDate.set(date, {free, blocks:dayBlocks});
      return;
    }
    // paused on some days
    if (rng() < 0.06) {
      const note = PAUSE_NOTES[Math.floor(rng()*PAUSE_NOTES.length)];
      dayBlocks.push({start:DAY_START, end:DAY_END, kind:"paused", note});
      perDate.set(date, {free, blocks:dayBlocks});
      return;
    }
    // short day — unavailable after some hour
    const earlyEnd = rng() < 0.25;
    const dayEnd = earlyEnd ? 12*60 + Math.floor(rng()*3)*60 : DAY_END;
    // drop a midday block as break
    const breakStart = 13*60 + (rng()<0.5?0:60);
    // 1-3 booked slots per day
    const nBooked = 1 + Math.floor(rng()*3);
    const booked = [];
    let t = DAY_START + Math.floor(rng()*4)*30;
    for (let b = 0; b < nBooked && t < dayEnd; b++) {
      const len = rng() < 0.4 ? 2 : 3; // 60 / 90 min
      if (t >= breakStart && t < breakStart + 2*60) t = breakStart + 2*60;
      if (t + len*30 > dayEnd) break;
      const L = LEARNERS[Math.floor(rng()*LEARNERS.length)];
      const course = rng() < 0.3 ? COURSES[Math.floor(rng()*COURSES.length)] : L[2];
      booked.push({start:t, end:t+len*GRID_MINUTES, kind:"booked", learner:L[0], course, area:L[1], note:"", tentative:rng()<0.2});
      t += len*30 + Math.floor(rng()*6)*30;
    }
    booked.forEach(b => dayBlocks.push(b));
    // payment hold block
    if (rng() < 0.1 && booked.length) {
      const b = booked[Math.floor(rng()*booked.length)];
      if (b) dayBlocks.push({start:b.start, end:b.end, kind:"hold"});
    }
    // compute free minutes
    for (let m = DAY_START; m < dayEnd; m += GRID_MINUTES) {
      const covered = dayBlocks.some(b => m >= b.start && m < b.end);
      if (!covered && !(m >= breakStart && m < breakStart + 2*60)) free.add(m);
    }
    windowTotals.set(instr.id, windowTotals.get(instr.id) + free.size);
    perDate.set(date, {free, blocks:dayBlocks});
  });
  freeGrid.set(instr.id, perDate);
  blocks.set(instr.id, perDate);
});

// ===== app state =====
let sort = "freeDesc";
let query = "";
let compareIds = [];
let expanded = new Set();
let dateIndex = 0;
let selectedMonth = monthKey(dates[0]);
let pop = null; // {instrId, minute}

function monthKey(iso){ return iso.slice(0,7); }
const months = [...new Set(dates.map(monthKey))];
function activeMonth(){ return months.includes(selectedMonth) ? selectedMonth : months[0]; }
function visibleDates(){ return dates.filter(d => monthKey(d) === activeMonth()); }
function allFree(instrId){ return new Set([...freeGrid.get(instrId).keys()].flatMap(d => [...freeGrid.get(instrId).get(d).free])); }

const $ = (id) => document.getElementById(id);

function shownRows(){
  let list = compareIds.length ? compareIds.map(id => INSTRUCTORS.find(i=>i.id===id)) : INSTRUCTORS.filter(i => !query || i.name.toLowerCase().includes(query.toLowerCase()));
  list = list.filter(Boolean);
  const getTotal = i => windowTotals.get(i.id);
  list.sort((a,b) => sort === "alpha" ? a.name.localeCompare(b.name) : sort === "freeAsc" ? getTotal(a)-getTotal(b) : getTotal(b)-getTotal(a));
  return list;
}

function render(){
  const month = activeMonth();
  const vis = visibleDates();
  const safeIndex = Math.min(dateIndex, vis.length-1);
  const selectedDate = vis[safeIndex] || dates[0];
  const mIdx = months.indexOf(month);

  $("calMonth").textContent = monthLabel(month);
  $("btnPrev").disabled = mIdx <= 0;
  $("btnNext").disabled = mIdx >= months.length-1;
  $("monthSelect").innerHTML = months.map(ms => `<option value="${ms}" ${ms===month?"selected":""}>${monthLabel(ms)}</option>`).join("");

  // tabs
  const dTot = {};
  dates.forEach(d => {
    let n = 0;
    INSTRUCTORS.forEach(i => n += freeGrid.get(i.id).get(d).free.size);
    dTot[d] = n;
  });
  $("tabs").innerHTML = vis.map((d,i) => {
    const {weekday, day} = shortDate(d);
    return `<button type="button" class="tab ${i===safeIndex?"active":""}" onclick="setDate(${i})"><span>${weekday}</span><strong>${day}</strong><em>${dTot[d]} free</em></button>`;
  }).join("");

  // summary
  const rows = shownRows();
  const selTotal = dTot[selectedDate] || 0;
  const fl = shortDate(vis[0]), tl = shortDate(vis[vis.length-1]);
  $("summary").innerHTML = compareIds.length
    ? `Comparing <strong>${rows.length}</strong> instructor${rows.length===1?"":"s"} &middot; <strong>${selTotal}</strong> free slots on ${fl.weekday} ${fl.date} <button class="clear-select" onclick="compareIds=[];closeSuggest();pop=null;render()">Clear selection</button>`
    : `<strong>${rows.length}</strong> instructor${rows.length===1?"":"s"} shown &middot; <strong>${selTotal}</strong> free slots &middot; ${fl.weekday} ${fl.date} &rarr; ${tl.weekday} ${tl.date} window`;

  // grid
  $("gridBody").innerHTML = rows.map(instr => {
    const isOpen = expanded.has(instr.id);
    const freeSet = allFree(instr.id);
    const windowTotal = windowTotals.get(instr.id);
    const title = `${instr.name} — ${windowTotal} free slots`;
    const cells = timeStarts.map((m, ti) => {
      const free = freeSet.has(m);
      const isSel = pop && pop.instrId === instr.id && pop.minute === m;
      const cls = ["cell", free ? "cell-free" : "", isSel ? "cell-selected" : ""].join(" ");
      const popHtml = isSel ? popHtmlFor(instr, selectedDate, m, free, ti) : "";
      return `<td class="${cls}" onclick="selectCell('${instr.id}',${m},event)">${popHtml}</td>`;
    }).join("");
    const mini = isOpen ? `
      <tr class="detail-row"><td colspan="${timeCols.length+1}">
        <div class="detail">
          ${instr.areas.length ? `<div class="detail-areas">Areas: ${instr.areas.join(", ")}</div>` : ""}
          <table class="mini"><thead><tr><th class="mini-date">Date</th>${timeCols.map(t=>`<th class="mini-time"><span class="time-label">${t}</span></th>`).join("")}</tr></thead>
          <tbody>${dates.filter(d=>monthKey(d)===month).map(d=>{
            const {weekday, date} = shortDate(d);
            const dayFree = freeGrid.get(instr.id).get(d).free;
            const dayCells = timeStarts.map(m => `<td class="cell ${dayFree.has(m)?"cell-free":""}"></td>`).join("");
            return `<tr class="mini-row ${d===selectedDate?"current":""}"><td class="mini-date">${weekday} ${date}<span class="mini-count">${dayFree.size}</span></td>${dayCells}</tr>`;
          }).join("")}</tbody></table>
        </div>
      </td></tr>` : "";
    const rm = compareIds.length ? `<button type="button" class="remove-instr" title="Remove ${instr.name} from compare" onclick="compareIds=compareIds.filter(id=>id!=='${instr.id}');pop=null;render()">&times;</button>` : "";
    return `<tr class="row"><td class="instructor-cell" title="${title}">
      <button type="button" class="expand" title="Show slots for all dates" onclick="toggleExpand('${instr.id}')">${isOpen?"&#9662;":"&#9656;"}</button>
      <div class="instructor-name">${instr.name}</div>${rm}</td>${cells}</tr>${mini}`;
  }).join("");
  $("empty").style.display = rows.length ? "none" : "block";
  updateSearchList();
}

function popHtmlFor(instr, date, minute, free, ti){
  const range = `${timeCols[ti]}–${minutesToTime(minute + GRID_MINUTES)}`;
  const inBlock = blocks.get(instr.id).get(date).blocks.find(b => minute >= b.start && minute < b.end && b.kind !== "unavailable") || null;
  if (free && !inBlock) {
    return `<div class="slot-pop"><div class="pop-title free">Free slot</div><div class="pop-line">${range}</div><div class="pop-line">Instructor: ${instr.name}</div><div class="pop-line">Available for booking</div></div>`;
  }
  const kind = inBlock ? inBlock.kind : "unavailable";
  const title = kind === "booked" ? (inBlock.tentative ? "Tentative" : "Booked") : kind === "paused" ? "Paused" : kind === "hold" ? "On hold — payment" : "Unavailable";
  const extra = inBlock ? [
    `Time: ${range}`,
    `Instructor: ${instr.name}`,
    inBlock.learner ? `Learner: ${inBlock.learner}` : null,
    inBlock.course ? `Course: ${inBlock.course}` : null,
    inBlock.area ? `Area: ${inBlock.area}` : null,
    inBlock.note || inBlock.tentative ? `Notes: ${inBlock.tentative ? "Pending confirmation" : inBlock.note}` : null
  ].filter(Boolean).map(l => `<div class="pop-line">${l}</div>`).join("") : "";
  return `<div class="slot-pop"><div class="pop-title busy">${title}</div>${extra}</div>`;
}

function selectCell(id, minute, e){
  e.stopPropagation();
  pop = (pop && pop.instrId === id && pop.minute === minute) ? null : {instrId:id, minute};
  render();
}

function toggleExpand(id){
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  pop = null; render();
}
function setDate(i){ dateIndex = i; pop = null; render(); }
function setMonth(m){ selectedMonth = m; dateIndex = 0; pop = null; render(); }
$("btnPrev").onclick = () => setMonth(months[Math.max(0, months.indexOf(activeMonth())-1)]);
$("btnNext").onclick = () => setMonth(months[Math.min(months.length-1, months.indexOf(activeMonth())+1)]);
$("btnToday").onclick = () => { setMonth(months[0]); dateIndex = 0; render(); };
$("monthSelect").onchange = e => setMonth(e.target.value);
$("sortSelect").onchange = e => { sort = e.target.value; render(); };

// ===== search / compare =====
$("searchInput").oninput = () => { query = $("searchInput").value.trim().toLowerCase(); render(); };
$("searchInput").onfocus = () => render();
$("searchInput").onkeydown = e => { if (e.key === "Escape") { query=""; $("searchInput").value=""; closeSuggest(); render(); } };
document.addEventListener("mousedown", e => { if (!e.target.closest(".search")) closeSuggest(); });

function updateSearchList(){
  const box = $("suggest");
  if (!query || !$("searchInput").value) { box.style.display = "none"; return; }
  const results = INSTRUCTORS.filter(i => i.name.toLowerCase().includes(query)).slice(0, 8);
  box.innerHTML = results.map(i => {
    const added = compareIds.includes(i.id);
    return `<li class="suggest-row ${added?"added":""}" onclick="toggleCompare('${i.id}')"><span class="suggest-name">${i.name}</span><span class="suggest-btn">${added?"&#10003; Added":"＋ Compare"}</span></li>`;
  }).join("");
  box.style.display = results.length ? "block" : "none";
}
function toggleCompare(id){
  compareIds = compareIds.includes(id) ? compareIds.filter(x => x !== id) : [...compareIds, id];
  query = ""; $("searchInput").value = ""; closeSuggest(); pop = null; render();
}
function closeSuggest(){ $("suggest").style.display = "none"; }

render();
</script>
